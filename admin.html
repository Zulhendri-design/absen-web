<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Absensi</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { margin: 0; color: #333; }

    .action-btns { display: flex; gap: 10px; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; color: white; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .btn-excel { background-color: #1e7e34; }
    .btn-excel:hover { background-color: #145a23; }
    .btn-logout { background-color: #dc3545; }
    .btn-logout:hover { background-color: #bd2130; }
    .btn-delete { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; border-radius: 4px; }
    .btn-delete:hover { background-color: #c0392b; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 18px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .stat-card h3 { margin: 0 0 8px; font-size: 12px; color: #6c757d; text-transform: uppercase; }
    .stat-card .value { font-size: 26px; font-weight: bold; }

    .filter-box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-box input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; }

    .table-container { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
    th { background-color: #f8f9fa; font-weight: 600; color: #495057; }
    
    .img-selfie { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 1px solid #ddd; }
    .badge { padding: 4px 8px; border-radius: 12px; font-weight: 600; font-size: 11px; }
    .badge-success { background: #d4edda; color: #155724; }
    .badge-danger { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Dashboard Rekap Absensi</h2>
    <div class="action-btns">
      <button class="btn btn-excel" onclick="exportToExcel()">📊 Ekspor Excel</button>
      <button class="btn btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><h3>Total Absensi</h3><div class="value" id="totalAbsen" style="color:#007bff">0</div></div>
    <div class="stat-card"><h3>Hadir (Dalam Area)</h3><div class="value" id="totalHadir" style="color:#28a745">0</div></div>
    <div class="stat-card"><h3>Ditolak / Luar Area</h3><div class="value" id="totalDitolak" style="color:#dc3545">0</div></div>
  </div>

  <div class="filter-box">
    <input type="text" id="searchNama" placeholder="Cari Nama Karyawan..." oninput="filterData()">
    <input type="date" id="searchTanggal" onchange="filterData()">
    <button class="btn" style="background:#6c757d;" onclick="resetFilter()">Reset Filter</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Foto Selfie</th>
          <th>Nama Karyawan</th>
          <th>Waktu & Tanggal</th>
          <th>Jarak Kantor</th>
          <th>Status</th>
          <th>Peta Lokasi</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelBody">
        <tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJmJXrF4IRqF5X_sD2SRJO7A6SVUGQTpk",
    authDomain: "absensi-lampung.firebaseapp.com",
    projectId: "absensi-lampung",
    storageBucket: "absensi-lampung.firebasestorage.app",
    messagingSenderId: "771796491077",
    appId: "1:771796491077:web:cbb577ab33755f11ad7c2c",
    measurementId: "G-FPVFE0E7HF"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let dataAbsensi = [];

  // Proteksi Halaman Admin
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      loadRealtimeData();
    }
  });

  window.logoutAdmin = function() {
    if (confirm("Apakah Anda yakin ingin logout?")) {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    }
  };

  function loadRealtimeData() {
    const q = query(collection(db, "absensi_selfie"), orderBy("waktu", "desc"));
    onSnapshot(q, (snapshot) => {
      dataAbsensi = [];
      snapshot.forEach((docSnap) => {
        dataAbsensi.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderTabel(dataAbsensi);
    });
  }

  window.renderTabel = function(data) {
    const tbody = document.getElementById('tabelBody');
    tbody.innerHTML = '';

    let hadir = 0;
    let ditolak = 0;

    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Tidak ada data absensi.</td></tr>`;
      document.getElementById('totalAbsen').innerText = 0;
      document.getElementById('totalHadir').innerText = 0;
      document.getElementById('totalDitolak').innerText = 0;
      return;
    }

    data.forEach((item, index) => {
      if (item.status && item.status.includes("Hadir")) hadir++;
      else ditolak++;

      let tgl = "-";
      let tglIso = "";
      if (item.waktu) {
        const d = item.waktu.toDate();
        tgl = d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        tglIso = d.toISOString().split('T')[0];
      }

      const mapUrl = `https://www.google.com/maps?q=${item.latitude},${item.longitude}`;
      const isHadir = item.status && item.status.includes("Hadir");

      const tr = document.createElement('tr');
      tr.setAttribute('data-tanggal', tglIso);
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><img src="${item.fotoUrl || 'https://via.placeholder.com/45'}" class="img-selfie" alt="Selfie"></td>
        <td><b>${item.nama}</b></td>
        <td>${tgl}</td>
        <td>${item.jarakMeter} meter</td>
        <td><span class="badge ${isHadir ? 'badge-success' : 'badge-danger'}">${item.status}</span></td>
        <td><a href="${mapUrl}" target="_blank" style="color:#007bff; text-decoration:none;">📍 Lihat Peta</a></td>
        <td><button class="btn btn-delete" onclick="hapusData('${item.id}', '${item.nama}')">🗑️ Hapus</button></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('totalAbsen').innerText = data.length;
    document.getElementById('totalHadir').innerText = hadir;
    document.getElementById('totalDitolak').innerText = ditolak;
  };

  // Fungsi Hapus Data Firestore
  window.hapusData = async function(docId, nama) {
    if (confirm(`Apakah Anda yakin ingin menghapus data absensi dari "${nama}"?`)) {
      try {
        await deleteDoc(doc(db, "absensi_selfie", docId));
        alert("Data berhasil dihapus!");
      } catch (err) {
        alert("Gagal menghapus data: " + err.message);
      }
    }
  };

  window.filterData = function() {
    const namaQuery = document.getElementById('searchNama').value.toLowerCase();
    const tglQuery = document.getElementById('searchTanggal').value;

    const filtered = dataAbsensi.filter(item => {
      const matchNama = item.nama.toLowerCase().includes(namaQuery);
      let matchTgl = true;
      if (tglQuery && item.waktu) {
        const itemTgl = item.waktu.toDate().toISOString().split('T')[0];
        matchTgl = (itemTgl === tglQuery);
      }
      return matchNama && matchTgl;
    });

    renderTabel(filtered);
  };

  window.resetFilter = function() {
    document.getElementById('searchNama').value = '';
    document.getElementById('searchTanggal').value = '';
    renderTabel(dataAbsensi);
  };

  window.exportToExcel = function() {
    const table = document.querySelector("table");
    const cloneTable = table.cloneNode(true);
    
    // Hapus kolom Foto dan Aksi saat ekspor ke Excel
    const rows = cloneTable.rows;
    for (let i = 0; i < rows.length; i++) {
      rows[i].deleteCell(7); // Hapus kolom Aksi
      rows[i].deleteCell(1); // Hapus kolom Foto
    }

    const wb = XLSX.utils.table_to_book(cloneTable, { sheet: "Absensi Karyawan" });
    XLSX.writeFile(wb, `Rekap_Absensi_${new Date().toISOString().split('T')[0]}.xlsx`);
  };
</script>
</body>
</html>
