<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Karyawan Lampung</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
    h2 { margin-top: 0; color: #333; font-size: 20px; }
    label { display: block; text-align: left; margin: 10px 0 5px; font-weight: 600; font-size: 13px; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    
    .camera-box { margin: 15px 0; background: #222; border-radius: 8px; overflow: hidden; position: relative; min-height: 220px; display: flex; justify-content: center; align-items: center; }
    video, canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
    
    .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; color: white; }
    .btn-primary { background-color: #007bff; }
    .btn-success { background-color: #28a745; }
    .btn:disabled { background-color: #6c757d; cursor: not-allowed; }

    #status { margin-top: 15px; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Form Absensi Selfie</h2>
    
    <label for="nama">Nama Karyawan:</label>
    <input type="text" id="nama" placeholder="Masukkan nama lengkap..." required>

    <div class="camera-box">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <button id="btnAbsen" class="btn btn-primary" onclick="prosesAbsen()">📸 Ambil Foto & Absen</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJmJXrF4IRqF5X_sD2SRJO7A6SVUGQTpk",
      authDomain: "absensi-lampung.firebaseapp.com",
      projectId: "absensi-lampung",
      storageBucket: "absensi-lampung.firebasestorage.app",
      messagingSenderId: "771796491077",
      appId: "1:771796491077:web:cbb577ab33755f11ad7c2c",
      measurementId: "G-FPVFE0E7HF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Titik Koordinat Kantor Lampung & Toleransi Jarak (Maksimal Meter)
    const KANTOR_LAT = -5.450000;  // Ganti koordinat kantor sebenarnya
    const KANTOR_LNG = 105.260000; // Ganti koordinat kantor sebenarnya
    const MAX_JARAK_METER = 100;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusDiv = document.getElementById('status');
    const btnAbsen = document.getElementById('btnAbsen');

    // Nyalakan Kamera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Gagal mengakses kamera. Izinkan akses kamera browser Anda!';
        btnAbsen.disabled = true;
      });

    // Hitung Jarak Lokasi (Haversine Formula)
    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    window.prosesAbsen = function() {
      const nama = document.getElementById('nama').value.trim();
      if (!nama) {
        alert('Masukkan Nama Karyawan terlebih dahulu!');
        return;
      }

      statusDiv.style.color = '#007bff';
      statusDiv.innerText = 'Memeriksa lokasi GPS...';
      btnAbsen.disabled = true;

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const jarak = hitungJarak(lat, lng, KANTOR_LAT, KANTOR_LNG);
          const statusAbsen = (jarak <= MAX_JARAK_METER) ? "Hadir (Dalam Area)" : "Ditolak (Luar Area)";

          statusDiv.innerText = 'Mengambil gambar & mengirim data...';

          // Tangkap gambar dari video webcam
          const context = canvas.getContext('2d');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);

          try {
            await addDoc(collection(db, "absensi_selfie"), {
              nama: nama,
              latitude: lat,
              longitude: lng,
              jarakMeter: jarak,
              status: statusAbsen,
              fotoUrl: fotoBase64,
              waktu: serverTimestamp()
            });

            statusDiv.style.color = (jarak <= MAX_JARAK_METER) ? 'green' : 'red';
            statusDiv.innerText = `Absensi Berhasil! Status: ${statusAbsen} (${jarak} meter dari kantor).`;
            document.getElementById('nama').value = '';
          } catch (err) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Gagal menyimpan absensi: ' + err.message;
          } finally {
            btnAbsen.disabled = false;
          }
        },
        (err) => {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'Akses GPS ditolak / tidak aktif! Pastikan GPS HP/Laptop menyala.';
          btnAbsen.disabled = false;
        },
        { enableHighAccuracy: true }
      );
    };
  </script>
</body>
</html>
