<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Rekap Absensi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
    }

    .card h4 { margin: 0; font-size: 13px; color: #666; text-transform: uppercase; }
    .card .num { font-size: 28px; font-weight: bold; margin-top: 10px; color: #2563eb; }

    .filter-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input, button {
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #ddd;
      outline: none;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      border: none;
    }

    .btn-excel { background: #16a34a; color: white; }
    .btn-logout { background: #dc2626; color: white; }
    .btn-reset { background: #64748b; color: white; }
    .btn-hapus { background: #dc2626; color: white; padding: 6px 12px; border-radius: 5px; }

    table {
      width: 100%;
      background: white;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th { background: #f8fafc; color: #475569; }

    .img-selfie {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ccc;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-masuk { background: #dcfce7; color: #166534; }
    .badge-pulang { background: #dbeafe; color: #1e40af; }
    .badge-ditolak { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Dashboard Rekap Absensi Karyawan</h2>
      <div>
        <button class="btn-excel" onclick="downloadExcel()">📊 Ekspor Excel</button>
        <button class="btn-logout" onclick="logout()">🚪 Logout</button>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <h4>Total Rekap</h4>
        <div class="num" id="totalAbsen">0</div>
      </div>
      <div class="card">
        <h4>Hadir (Dalam Area)</h4>
        <div class="num" style="color:#16a34a;" id="totalHadir">0</div>
      </div>
      <div class="card">
        <h4>Ditolak / Luar Area</h4>
        <div class="num" style="color:#dc2626;" id="totalDitolak">0</div>
      </div>
    </div>

    <div class="filter-box">
      <input type="text" id="filterNama" placeholder="Cari Nama Karyawan..." oninput="filterData()">
      <input type="date" id="filterTanggal" onchange="filterData()">
      <button class="btn-reset" onclick="resetFilter()">Reset Filter</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Foto</th>
          <th>Nama Karyawan</th>
          <th>Tanggal</th>
          <th>Jam Masuk</th>
          <th>Jam Pulang</th>
          <th>Jarak Kantor</th>
          <th>Status</th>
          <th>Peta Lokasi</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelAbsensi">
        <tr><td colspan="10">Memuat data absensi...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJmJXrF4IRqF5X_sD2SRJO7A6SVUGQTpk",
      authDomain: "absensi-lampung.firebaseapp.com",
      projectId: "absensi-lampung",
      storageBucket: "absensi-lampung.firebasestorage.app",
      messagingSenderId: "771796491077",
      appId: "1:771796491077:web:cbb577ab33755f11ad7c2c",
      measurementId: "G-FPVFE0E7HF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let rawData = [];
    let processedData = [];

    window.onload = function() {
      // PROTEKSI: Cek status login saat halaman dibuka
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        alert("Silakan login terlebih dahulu!");
        window.location.href = "index.html"; 
        return;
      }

      loadData();
    };

    window.logout = function() {
      if (confirm("Apakah Anda yakin ingin logout?")) {
        sessionStorage.removeItem("isLoggedIn");
        window.location.href = "index.html";
      }
    };

    function loadData() {
      onSnapshot(collection(db, "absensi"), (snapshot) => {
        rawData = [];
        snapshot.forEach((docSnap) => {
          rawData.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        rawData.sort((a, b) => {
          let tA = a.created_at ? (a.created_at.seconds || 0) : 0;
          let tB = b.created_at ? (b.created_at.seconds || 0) : 0;
          return tA - tB;
        });

        prosesKelompokData();
      }, (err) => {
        console.error("Gagal load data: ", err);
        document.getElementById("tabelAbsensi").innerHTML = `<tr><td colspan="10" style="color:red;">Gagal memuat data: ${err.message}</td></tr>`;
      });
    }

    function prosesKelompokData() {
      let mapData = {};

      rawData.forEach((d) => {
        let tgl = d.tanggal || (d.waktu ? d.waktu.split(',')[0] : '-') || '-';
        let jam = d.jam || (d.waktu ? d.waktu.split(',')[1] : '-') || '-';
        let nama = d.nama || d.namaKaryawan || 'Tanpa Nama';
        
        let key = `${nama}_${tgl}`;

        if (!mapData[key]) {
          mapData[key] = {
            id_masuk: d.id,
            id_pulang: null,
            nama: nama,
            tanggal: tgl,
            jam_masuk: jam,
            jam_pulang: "-",
            foto: d.foto || d.selfie || d.fotoSelfie || "",
            jarak: d.jarak || d.jarakKantor || "-",
            status: d.status || "Hadir",
            lat: d.lat || d.latitude,
            lng: d.lng || d.longitude
          };
        } else {
          mapData[key].jam_pulang = jam;
          mapData[key].id_pulang = d.id;
        }
      });

      processedData = Object.values(mapData).reverse();
      tampilkanTabel(processedData);
    }

    function tampilkanTabel(data) {
      let isi = "";
      let countHadir = 0;
      let countDitolak = 0;

      if (data.length === 0) {
        isi = `<tr><td colspan="10">Belum ada data absensi.</td></tr>`;
      } else {
        data.forEach((d, index) => {
          if (d.status.includes("Ditolak") || d.status.includes("Luar")) {
            countDitolak++;
          } else {
            countHadir++;
          }

          let lokasiBtn = (d.lat && d.lng) 
            ? `<a href="https://maps.google.com/?q=${d.lat},${d.lng}" target="_blank">📍 Lihat Peta</a>`
            : `-`;

          let fotoSrc = d.foto && d.foto.length > 20 ? d.foto : 'https://via.placeholder.com/45';

          isi += `<tr>
            <td>${index + 1}</td>
            <td><img src="${fotoSrc}" class="img-selfie" onerror="this.src='https://via.placeholder.com/45'"></td>
            <td><b>${d.nama}</b></td>
            <td>${d.tanggal}</td>
            <td><span class="badge badge-masuk">🟢 ${d.jam_masuk}</span></td>
            <td><span class="badge badge-pulang">🔴 ${d.jam_pulang}</span></td>
            <td>${d.jarak}</td>
            <td><span class="badge ${d.status.includes('Ditolak') ? 'badge-ditolak' : 'badge-masuk'}">${d.status}</span></td>
            <td>${lokasiBtn}</td>
            <td><button class="btn-hapus" onclick="hapusBaris('${d.id_masuk}', '${d.id_pulang}')">Hapus</button></td>
          </tr>`;
        });
      }

      document.getElementById("tabelAbsensi").innerHTML = isi;
      document.getElementById("totalAbsen").innerText = data.length;
      document.getElementById("totalHadir").innerText = countHadir;
      document.getElementById("totalDitolak").innerText = countDitolak;
    }

    window.filterData = function() {
      let nama = document.getElementById("filterNama").value.toLowerCase();
      let tgl = document.getElementById("filterTanggal").value;

      let filtered = processedData.filter(d => {
        let matchNama = d.nama.toLowerCase().includes(nama);
        let matchTgl = tgl ? d.tanggal === tgl : true;
        return matchNama && matchTgl;
      });

      tampilkanTabel(filtered);
    };

    window.resetFilter = function() {
      document.getElementById("filterNama").value = "";
      document.getElementById("filterTanggal").value = "";
      tampilkanTabel(processedData);
    };

    window.hapusBaris = async function(idMasuk, idPulang) {
      if (confirm("Hapus data absensi ini?")) {
        try {
          if (idMasuk) await deleteDoc(doc(db, "absensi", idMasuk));
          if (idPulang) await deleteDoc(doc(db, "absensi", idPulang));
        } catch (e) {
          alert("Gagal menghapus: " + e.message);
        }
      }
    };

    window.downloadExcel = function() {
      if (processedData.length === 0) return alert("Tidak ada data!");
      let csv = "Nama,Tanggal,Jam Masuk,Jam Pulang,Jarak,Status\n";
      processedData.forEach(d => {
        csv += `"${d.nama}","${d.tanggal}","${d.jam_masuk}","${d.jam_pulang}","${d.jarak}","${d.status}"\n`;
      });
      let blob = new Blob([csv], { type: 'text/csv' });
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Rekap_Absensi.csv`;
      a.click();
    };
  </script>
</body>
</html>
