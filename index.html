<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Karyawan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f1f5f9;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #1e293b;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #475569;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .camera-box {
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video,
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #photoPreview {
      display: none;
    }

    .btn-camera {
      background: #475569;
      color: white;
      border: none;
      margin-bottom: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .btn-camera:hover {
      background: #334155;
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .info-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      color: #166534;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>📍 Absensi Karyawan</h2>

    <!-- GPS SEKARANG HANYA INFORMASI, BUKAN SYARAT ABSEN -->
    <div class="info-box" id="infoLokasi">
      📍 Absensi dapat dilakukan dari mana saja.
    </div>

    <form id="formAbsen">

      <!-- NAMA -->
      <div class="form-group">
        <label>Nama Karyawan</label>

        <input
          type="text"
          id="nama"
          placeholder="Masukkan nama lengkap"
          required
        >
      </div>

      <!-- TIPE ABSENSI -->
      <div class="form-group">

        <label>Tipe Absensi</label>

        <select id="tipeAbsen" required>

          <option value="Masuk">
            Hadir - Masuk
          </option>

          <option value="Pulang">
            Hadir - Pulang
          </option>

          <option value="Izin">
            Izin
          </option>

          <option value="Sakit">
            Sakit
          </option>

          <option value="Cuti">
            Cuti
          </option>

        </select>

      </div>

      <!-- FOTO -->
      <div class="form-group">

        <label>Foto Selfie</label>

        <div class="camera-box">

          <video
            id="webcam"
            autoplay
            playsinline>
          </video>

          <img
            id="photoPreview"
            alt="Hasil Foto">

        </div>

        <button
          type="button"
          class="btn-camera"
          id="btnAmbilFoto"
          onclick="takeSnapshot()">

          📸 Ambil Foto Selfie

        </button>

      </div>

      <!-- KIRIM -->
      <button
        type="submit"
        class="btn-submit"
        id="btnKirim">

        KIRIM ABSENSI

      </button>

    </form>

  </div>

  <canvas
    id="canvas"
    style="display:none;">
  </canvas>


  <script type="module">

    /* ==========================================
       FIREBASE
    ========================================== */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyDJmJXrF4IRqF5X_sD2SRJO7A6SVUGQTpk",

      authDomain:
        "absensi-lampung.firebaseapp.com",

      projectId:
        "absensi-lampung",

      storageBucket:
        "absensi-lampung.firebasestorage.app",

      messagingSenderId:
        "771796491077",

      appId:
        "1:771796491077:web:cbb577ab33755f11ad7c2c",

      measurementId:
        "G-FPVFE0E7HF"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    /* ==========================================
       VARIABEL
    ========================================== */

    let userLat = null;
    let userLng = null;
    let fotoDataUrl = "";


    const video =
      document.getElementById("webcam");

    const canvas =
      document.getElementById("canvas");

    const photoPreview =
      document.getElementById("photoPreview");

    const btnAmbilFoto =
      document.getElementById("btnAmbilFoto");


    /* ==========================================
       KAMERA
    ========================================== */

    navigator.mediaDevices
      .getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      })

      .then(stream => {

        video.srcObject = stream;

      })

      .catch(err => {

        alert(
          "Gagal mengakses kamera: "
          + err.message
        );

      });


    /* ==========================================
       GPS OPSIONAL
       
       GPS TIDAK LAGI MENJADI SYARAT ABSEN
    ========================================== */

    if (navigator.geolocation) {

      navigator.geolocation.getCurrentPosition(

        pos => {

          userLat =
            pos.coords.latitude;

          userLng =
            pos.coords.longitude;

          document.getElementById(
            "infoLokasi"
          ).innerHTML =

            "📍 Lokasi terdeteksi. " +
            "Absensi tetap dapat dilakukan dari mana saja.";

        },

        err => {

          // GPS gagal = TIDAK MASALAH

          userLat = null;
          userLng = null;

          document.getElementById(
            "infoLokasi"
          ).innerHTML =

            "🌐 Mode bebas lokasi. " +
            "GPS tidak diperlukan untuk melakukan absensi.";

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 300000
        }

      );

    } else {

      document.getElementById(
        "infoLokasi"
      ).innerHTML =

        "🌐 Mode bebas lokasi. " +
        "GPS tidak diperlukan untuk melakukan absensi.";

    }


    /* ==========================================
       AMBIL FOTO
    ========================================== */

    window.takeSnapshot = function() {

      if (fotoDataUrl === "") {

        canvas.width = 300;
        canvas.height = 300;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        fotoDataUrl =
          canvas.toDataURL(
            "image/jpeg",
            0.5
          );

        photoPreview.src =
          fotoDataUrl;

        photoPreview.style.display =
          "block";

        video.style.display =
          "none";

        btnAmbilFoto.innerText =
          "🔄 Foto Ulang";

      } else {

        fotoDataUrl = "";

        photoPreview.style.display =
          "none";

        video.style.display =
          "block";

        btnAmbilFoto.innerText =
          "📸 Ambil Foto Selfie";

      }

    };


    /* ==========================================
       SUBMIT ABSENSI
    ========================================== */

    document
      .getElementById("formAbsen")
      .addEventListener(
        "submit",
        async (e) => {

          e.preventDefault();


          const nama =
            document
              .getElementById("nama")
              .value
              .trim();


          const tipe =
            document
              .getElementById("tipeAbsen")
              .value;


          /* FOTO WAJIB */

          if (!fotoDataUrl) {

            alert(
              "Harap ambil foto selfie terlebih dahulu!"
            );

            return;

          }


          /* =====================================
             TIDAK ADA LAGI PENGECEKAN GPS
          ===================================== */


          let statusAbsen =
            "Hadir";


          if (
            tipe === "Izin" ||
            tipe === "Sakit" ||
            tipe === "Cuti"
          ) {

            statusAbsen = tipe;

          }


          /* =====================================
             WAKTU OTOMATIS
          ===================================== */

          const now =
            new Date();


          const optionsTanggal = {

            day: "numeric",
            month: "short",
            year: "numeric"

          };


          const optionsJam = {

            hour: "2-digit",
            minute: "2-digit",
            hour12: false

          };


          const tglFormat =
            now.toLocaleDateString(
              "id-ID",
              optionsTanggal
            );


          const jamFormat =
            now
              .toLocaleTimeString(
                "id-ID",
                optionsJam
              )
              .replace(".", ":");


          const waktuLengkap =
            `${tglFormat}, ${jamFormat}`;


          /* =====================================
             TOMBOL
          ===================================== */

          const btnKirim =
            document.getElementById(
              "btnKirim"
            );


          btnKirim.disabled =
            true;


          btnKirim.innerText =
            "Mengirim...";


          /* =====================================
             DATA LOKASI
             
             GPS OPSIONAL
          ===================================== */

          let lokasiLat =
            null;

          let lokasiLng =
            null;

          let jarakText =
            "-";


          if (
            userLat !== null &&
            userLng !== null
          ) {

            lokasiLat =
              userLat;

            lokasiLng =
              userLng;

            jarakText =
              "GPS tersedia";

          }


          /* =====================================
             SIMPAN KE FIRESTORE
          ===================================== */

          try {

            await addDoc(
              collection(
                db,
                "absensi"
              ),
              {

                nama: nama,

                tipe: tipe,

                status: statusAbsen,

                waktu: waktuLengkap,

                tanggal:
                  now
                    .toISOString()
                    .split("T")[0],

                jam: jamFormat,

                foto: fotoDataUrl,

                lat: lokasiLat,

                lng: lokasiLng,

                jarak: jarakText,

                created_at:
                  serverTimestamp()

              }
            );


            /* =================================
               BERHASIL
            ================================= */

            alert(
              "✅ Absensi berhasil dikirim!\n\n" +
              "Nama: " + nama + "\n" +
              "Tipe: " + tipe + "\n" +
              "Waktu: " + waktuLengkap
            );


            location.reload();


          } catch (err) {

            console.error(err);


            alert(
              "Gagal menyimpan absensi: "
              + err.message
            );


            btnKirim.disabled =
              false;


            btnKirim.innerText =
              "KIRIM ABSENSI";

          }

        }
      );

  </script>

</body>
</html>
