<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Geofencing</title>
</head>
<body>
  <h2>Absensi Kehadiran</h2>
  <button onclick="prosesAbsen()">Absen Sekarang</button>
  <p id="status"></p>

  <script>
    // 1. Tentukan Koordinat Kantor & Radius Maksimal (Meter)
    const KANTOR_LAT = -6.175392;  // Contoh: Monas, Jakarta
    const KANTOR_LNG = 106.827153;
    const MAX_RADIUS_METER = 50;   // Maksimal 50 meter dari kantor

    // 2. Rumus Haversine (Hitung Jarak 2 Titik Koordinat)
    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radius bumi dalam meter
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;

      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c; // Hasil dalam satuan meter
    }

    // 3. Fungsi Utama Absen
    function prosesAbsen() {
      const status = document.getElementById('status');
      status.innerText = "Mendeteksi lokasi...";

      if (!navigator.geolocation) {
        status.innerText = "Browser kamu tidak mendukung Geolocation.";
        return;
      }

      // Ambil lokasi GPS HP (highAccuracy = true agar lebih presisi)
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const akurasi = position.coords.accuracy; // Akurasi sinyal dalam meter

          const jarak = hitungJarak(userLat, userLng, KANTOR_LAT, KANTOR_LNG);

          if (jarak <= MAX_RADIUS_METER) {
            status.innerHTML = `<b style="color:green">Absen Berhasil!</b><br>Jarak Anda: ${jarak.toFixed(1)}m dari kantor (Akurasi GPS: +/- ${akurasi.toFixed(1)}m)`;
          } else {
            status.innerHTML = `<b style="color:red">Absen Ditolak!</b><br>Anda berada ${jarak.toFixed(1)}m dari kantor (Maksimal ${MAX_RADIUS_METER}m).`;
          }
        },
        (error) => {
          status.innerText = "Gagal mengambil lokasi. Pastikan GPS/Izin Lokasi aktif.";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
