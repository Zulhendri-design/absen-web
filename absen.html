<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Karyawan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f1f5f9;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #1e293b;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #475569;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .camera-box {
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video,
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #photoPreview {
      display: none;
    }

    .btn-camera {
      background: #475569;
      color: white;
      border: none;
      margin-bottom: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .btn-camera:hover {
      background: #334155;
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* KOTAK STATUS LOKASI */
    .info-box {
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
    }

    .info-box.loading {
      background: #fef3c7;
      border: 1px solid #fde047;
      color: #854d0e;
    }

    .info-box.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .info-box.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>📍 Absensi Karyawan</h2>

    <!-- STATUS GPS -->
    <div class="info-box loading" id="infoLokasi" onclick="mintaAksesLokasi()">
      ⏳ Mengambil lokasi GPS...
    </div>

    <form id="formAbsen">

      <!-- NAMA -->
      <div class="form-group">
        <label>Nama Karyawan</label>
        <input
          type="text"
          id="nama"
          placeholder="Masukkan nama lengkap"
          required
        >
      </div>

      <!-- TIPE ABSENSI -->
      <div class="form-group">
        <label>Tipe Absensi</label>
        <select id="tipeAbsen" required>
          <option value="Masuk">Hadir - Masuk</option>
          <option value="Pulang">Hadir - Pulang</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Cuti">Cuti</option>
        </select>
      </div>

      <!-- FOTO -->
      <div class="form-group">
        <label>Foto Selfie</label>
        <div class="camera-box">
          <video id="webcam" autoplay playsinline></video>
          <img id="photoPreview" alt="Hasil Foto">
        </div>
        <button
          type="button"
          class="btn-camera"
          id="btnAmbilFoto"
          onclick="takeSnapshot()">
          📸 Ambil Foto Selfie
        </button>
      </div>

      <!-- KIRIM -->
      <button
        type="submit"
        class="btn-submit"
        id="btnKirim">
        KIRIM ABSENSI
      </button>

    </form>

  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script type="module">

    /* ==========================================
       FIREBASE CONFIG
    ========================================== */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJmJXrF4IRqF5X_sD2SRJO7A6SVUGQTpk",
      authDomain: "absensi-lampung.firebaseapp.com",
      projectId: "absensi-lampung",
      storageBucket: "absensi-lampung.firebasestorage.app",
      messagingSenderId: "771796491077",
      appId: "1:771796491077:web:cbb577ab33755f11ad7c2c",
      measurementId: "G-FPVFE0E7HF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* ==========================================
       VARIABEL & ELEMENT
    ========================================== */
    let userLat = null;
    let userLng = null;
    let fotoDataUrl = "";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const photoPreview = document.getElementById("photoPreview");
    const btnAmbilFoto = document.getElementById("btnAmbilFoto");
    const infoLokasi = document.getElementById("infoLokasi");

    /* ==========================================
       KAMERA
    ========================================== */
    navigator.mediaDevices
      .getUserMedia({
        video: { facingMode: "user" },
        audio: false
      })
      .then(stream => {
        video.srcObject = stream;
      })
      .catch(err => {
        alert("Gagal mengakses kamera: " + err.message);
      });

    /* ==========================================
       FUNGSI DETEKSI LOKASI WAJIB
    ========================================== */
    window.mintaAksesLokasi = function() {
      infoLokasi.className = "info-box loading";
      infoLokasi.innerHTML = "⏳ Mengambil lokasi GPS...";

      if (!navigator.geolocation) {
        infoLokasi.className = "info-box error";
        infoLokasi.innerHTML = "❌ Browser Anda tidak mendukung GPS.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;

          infoLokasi.className = "info-box success";
          infoLokasi.innerHTML = `📍 Lokasi Terdeteksi:<br><strong>Lat: ${userLat.toFixed(5)}, Lng: ${userLng.toFixed(5)}</strong>`;
        },
        err => {
          userLat = null;
          userLng = null;
          infoLokasi.className = "info-box error";
          infoLokasi.innerHTML = "⚠️ Gagal mengambil lokasi! Aktifkan GPS HP & klik di sini untuk coba lagi.";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    };

    // Jalankan deteksi lokasi otomatis saat web pertama dibuka
    mintaAksesLokasi();

    /* ==========================================
       AMBIL FOTO
    ========================================== */
    window.takeSnapshot = function() {
      if (fotoDataUrl === "") {
        canvas.width = 300;
        canvas.height = 300;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        fotoDataUrl = canvas.toDataURL("image/jpeg", 0.5);
        photoPreview.src = fotoDataUrl;

        photoPreview.style.display = "block";
        video.style.display = "none";
        btnAmbilFoto.innerText = "🔄 Foto Ulang";
      } else {
        fotoDataUrl = "";
        photoPreview.style.display = "none";
        video.style.display = "block";
        btnAmbilFoto.innerText = "📸 Ambil Foto Selfie";
      }
    };

    /* ==========================================
       SUBMIT ABSENSI
    ========================================== */
    document.getElementById("formAbsen").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nama = document.getElementById("nama").value.trim();
      const tipe = document.getElementById("tipeAbsen").value;

      // VALIDASI 1: FOTO WAJIB
      if (!fotoDataUrl) {
        alert("Harap ambil foto selfie terlebih dahulu!");
        return;
      }

      // VALIDASI 2: LOKASI GPS WAJIB
      if (userLat === null || userLng === null) {
        alert("⚠️ Lokasi GPS belum terdeteksi!\n\nPastikan GPS HP kamu AKTIF, lalu ketuk kotak merah di bagian atas untuk mendeteksi ulang lokasi.");
        mintaAksesLokasi();
        return;
      }

      let statusAbsen = "Hadir";
      if (tipe === "Izin" || tipe === "Sakit" || tipe === "Cuti") {
        statusAbsen = tipe;
      }

      const now = new Date();
      const optionsTanggal = { day: "numeric", month: "short", year: "numeric" };
      const optionsJam = { hour: "2-digit", minute: "2-digit", hour12: false };

      const tglFormat = now.toLocaleDateString("id-ID", optionsTanggal);
      const jamFormat = now.toLocaleTimeString("id-ID", optionsJam).replace(".", ":");
      const waktuLengkap = `${tglFormat}, ${jamFormat}`;

      const btnKirim = document.getElementById("btnKirim");
      btnKirim.disabled = true;
      btnKirim.innerText = "Mengirim...";

      try {
        await addDoc(collection(db, "absensi"), {
          nama: nama,
          tipe: tipe,
          status: statusAbsen,
          waktu: waktuLengkap,
          tanggal: now.toISOString().split("T")[0],
          jam: jamFormat,
          foto: fotoDataUrl,
          lat: userLat,
          lng: userLng,
          lokasi_link: `https://maps.google.com/?q=${userLat},${userLng}`,
          created_at: serverTimestamp()
        });

        alert(`✅ Absensi Berhasil!\n\nNama: ${nama}\nTipe: ${tipe}\nKoordinat: ${userLat}, ${userLng}`);
        location.reload();

      } catch (err) {
        console.error(err);
        alert("Gagal menyimpan absensi: " + err.message);
        btnKirim.disabled = false;
        btnKirim.innerText = "KIRIM ABSENSI";
      }
    });

  </script>

</body>
</html>
